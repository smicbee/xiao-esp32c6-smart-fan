<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760">
<defs>
  <style>.b{fill:#101820;stroke:#58c4dc;stroke-width:3}.g{fill:#14352f;stroke:#4fd1a1;stroke-width:3}.o{fill:#3b2515;stroke:#ffad5a;stroke-width:3}.r{fill:#241b36;stroke:#b99cff;stroke-width:3}.t{fill:#f4f7f8;font:22px sans-serif}.s{fill:#b8c8cf;font:16px sans-serif}.a{stroke:#58c4dc;stroke-width:4;fill:none;marker-end:url(#m)}.c{stroke:#58c4dc;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#m)}.f{stroke:#4fd1a1;stroke-width:4;fill:none;marker-end:url(#mg)}.d{stroke:#b99cff;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#mp)}</style>
  <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58c4dc"/></marker>
  <marker id="mg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4fd1a1"/></marker>
  <marker id="mp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b99cff"/></marker>
</defs>
<rect width="1320" height="760" rx="24" fill="#071015"/>
<text x="50" y="52" class="t" font-weight="bold">Latest-target, fresh-feedback controller</text>
<text x="50" y="80" class="s">Blue = command path · Green = measured hardware path · Purple = state-only publication</text>

<!-- command row -->
<rect x="45" y="120" width="250" height="110" rx="18" class="b"/><text x="78" y="163" class="t">Home Assistant</text><text x="83" y="195" class="s">state + speed intent</text>
<rect x="385" y="105" width="300" height="140" rx="18" class="g"/><text x="430" y="150" class="t">Request capture</text><text x="420" y="183" class="s">requested_on / stage</text><text x="420" y="211" class="s">request_generation++</text>
<rect x="795" y="105" width="330" height="140" rx="18" class="b"/><text x="850" y="150" class="t">250 ms dispatcher</text><text x="835" y="183" class="s">exactly one worker</text><text x="835" y="211" class="s">new generation remains pending</text>
<path d="M295 175 H385" class="a"/><path d="M685 175 H795" class="a"/>

<!-- action row -->
<rect x="795" y="330" width="330" height="145" rx="18" class="g"/><text x="835" y="374" class="t">Fresh ADC/D1 snapshot</text><text x="835" y="408" class="s">16-sample immediate average</text><text x="835" y="436" class="s">classify Off / 1 / 2 / 3</text>
<rect x="405" y="330" width="300" height="145" rx="18" class="o"/><text x="448" y="374" class="t">Minimal action</text><text x="435" y="408" class="s">Power or cyclic Speed</text><text x="435" y="436" class="s">50 ms open-drain pulse</text>
<rect x="45" y="330" width="270" height="145" rx="18" class="b"/><text x="94" y="374" class="t">Original fan</text><text x="78" y="408" class="s">motor / buttons / charger</text><text x="78" y="436" class="s">protection retained</text>
<path d="M960 245 V330" class="a"/><path d="M795 402 H705" class="a"/><path d="M405 402 H315" class="a"/>
<path d="M1125 364 C1215 364 1215 265 1125 220" class="c"/><text x="1135" y="305" class="s">pending newer generation</text>

<!-- feedback row -->
<rect x="205" y="565" width="320" height="120" rx="18" class="g"/><text x="245" y="608" class="t">Slow stable feedback</text><text x="238" y="642" class="s">median + hysteresis + 5 samples</text>
<rect x="615" y="550" width="340" height="150" rx="18" class="r"/><text x="680" y="593" class="t">Reconciliation</text><text x="650" y="627" class="s">publish confirmed physical state</text><text x="650" y="657" class="s">state only — never drive GPIO</text>
<rect x="1045" y="565" width="235" height="120" rx="18" class="r"/><text x="1075" y="608" class="t">HA reported state</text><text x="1085" y="642" class="s">Off / Stage 1–3</text>
<path d="M180 475 C180 535 250 545 300 565" class="f"/><path d="M525 625 H615" class="f"/><path d="M955 625 H1045" class="d"/>
<text x="55" y="730" class="s">A hardware-state publication cannot become a user request; the guard prevents feedback loops and unintended button pulses.</text>
</svg>