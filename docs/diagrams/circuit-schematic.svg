ext x="131.68800000000002" y="-568.2144000000001" dominant-baseline="central" fill="#516a77" font-size="12" font-family="sans" text-anchor="middle"><tspan x="131.68800000000002" dy="12">open-drain GPIO</tspan></text><text x="618.264" y="-589.2848" dominant-baseline="central" fill="#16303f" font-size="17" font-family="sans" text-anchor="middle"><tspan x="618.264" dy="17">Original fan PCB</tspan></text><text x="618.264" y="-568.2144000000001" dominant-baseline="central" fill="#516a77" font-size="12" font-family="sans" text-anchor="middle"><tspan x="618.264" dy="12">physical buttons remain installed</tspan></text><text x="189.72" y="-543.7696000000001" dominant-baseline="central" fill="#006b8f" font-size="13" font-family="sans" text-anchor="middle"><tspan x="189.72" dy="13">D6 / GPIO16</tspan></text><text x="564.696" y="-552.6976" dominant-baseline="central" fill="#087c54" font-size="13" font-family="sans" text-anchor="middle"><tspan x="564.696" dy="13">POWER signal</tspan></text><text x="189.72" y="-525.9136" dominant-baseline="central" fill="#006b8f" font-size="13" font-family="sans" text-anchor="middle"><tspan x="189.72" dy="13">D5 / GPIO23</tspan></text><text x="564.696" y="-525.9136" dominant-baseline="central" fill="#087c54" font-size="13" font-family="sans" text-anchor="middle"><tspan x="564.696" dy="13">SPEED signal</tspan></text><text x="374.976" y="-615.5328" dominant-baseline="central" fill="#006b8f" font-size="12" font-family="sans" text-anchor="middle"><tspan x="374.976" dy="12">50 ms LOW · output released to high impedance afterward</tspan></text><text x="366.04800000000006" y="-464.2032" dominant-baseline="central" fill="#516a77" font-size="12" font-family="sans" text-anchor="middle"><tspan x="366.04800000000006" dy="12">verified common ground</tspan></text><text x="107.136" y="-447.544" dominant-baseline="central" fill="#16303f" font-size="19" font-family="sans" text-anchor="middle"><tspan x="107.136" dy="19">2  Passive voltage measurements</tspan></tex