e="12" font-family="sans" text-anchor="middle"><tspan x="540.144" dy="12">factor = 2.0</tspan></text><text x="544.608" y="-344.06800000000004" dominant-baseline="central" fill="#516a77" font-size="11.5" font-family="sans" text-anchor="middle"><tspan x="544.608" dy="11.5">No 100 nF capacitor fitted at GPIO1</tspan></text><text x="540.144" y="-241.39600000000002" dominant-baseline="central" fill="#bd3038" font-size="11.5" font-family="sans" text-anchor="middle"><tspan x="540.144" dy="11.5">Never connect MOTOR+ or BAT+ directly to an ADC</tspan></text><text x="93.744" y="-180.5968" dominant-baseline="central" fill="#16303f" font-size="19" font-family="sans" text-anchor="middle"><tspan x="93.744" dy="19">3  BMP280 in SPI mode</tspan></text><text x="131.68800000000002" y="-144.224" dominant-baseline="central" fill="#16303f" font-size="17" font-family="sans" text-anchor="middle"><tspan x="131.68800000000002" dy="17">XIAO ESP32C6</tspan></text><text x="618.264" y="-144.224" dominant-baseline="central" fill="#16303f" font-size="17" font-family="sans" text-anchor="middle"><tspan x="618.264" dy="17">BMP280 breakout</tspan></text><text x="170.52480000000003" y="-123.6" dominant-baseline="central" fill="#6840a0" font-size="12" font-family="sans" text-anchor="middle"><tspan x="170.52480000000003" dy="12">D7 / GPIO17  MISO</tspan></text><text x="566.928" y="-132.52800000000002" dominant-baseline="central" fill="#6840a0" font-size="12" font-family="sans" text-anchor="middle"><tspan x="566.928" dy="12">SDO / MISO</tspan></text><text x="170.52480000000003" y="-113.3328" dominant-baseline="central" fill="#6840a0" font-size="12" font-family="sans" text-anchor="middle"><tspan x="170.52480000000003" dy="12">D8 / GPIO19  CS</tspan></text><text x="566.928" y="-113.3328" dominant-baseline="central" fill="#6840a0" font-size="12" font-family="sans" text-anchor="middle"><tspan x="566.928" dy="12">CSB</tspan></text><text x="170.52480000000003" y="-94.13760000000002" dominant-baseline="central" fill="#6840a0" font-size="12" font-family="sans" text-anchor="middle"><tspan x="170.52480000000003" dy="12">D9 / GPIO20  SCK</tspan></text><text x="566.928" y="-94.13760000000002" dominant-baseline="central" fill="#6840a0" font-size="12" font-family="sans" text-anchor="middle"><tspan x="566.928" dy="12">SCL / SCK</tspan></text><text x="170.52480000000003" y="-74.9424" dominant-baseline="central" fill="#6840a0" font-size="12" font-family="sans" text-anchor="middle"><tspan x="170.52480000000003" dy="12">D10 / GPIO18  MOSI</tspan></text><text x="566.928" y="-74.9424" dominant-baseline="central" fill="#6840a0" font-size="12" font-family="sans" text-anchor="middle"><tspan x="566.928" dy="12">SDA / MOSI</tspan></text><text x="170.52480000000003" y="-55.7472" dominant-baseline="central" fill="#bd3038" font-size="12" font-family="sans" text-anchor="middle"><tspan x="170.52480000000003" dy="12">3V3</tspan></text><text x="566.928" y="-55.7472" dominant-baseline="central" fill="#bd3038" font-size="12" font-family="sans" text-anchor="middle"><tspan x="566.928" dy="12">VCC (3.3 V)</tspan></text><text x="170.52480000000003" y="-36.55200000000001" dominant-baseline="central" fill="#16303f" font-size="12" font-family="sans" text-anchor="middle"><tspan x="170.52480000000003" dy="12">GND</tspan></text><text x="566.928" y="-36.55200000000001" dominant-baseline="central" fill="#16303f" font-size="12" font-family="sans" text-anchor="middle"><tspan x="566.928" dy="12">GND</tspan></text><text x="374.976" y="-6.1432" dominant-baseline="central" fill="#516a77" font-size="11.5" font-family="sans" text-anchor="middle"><tspan x="374.976" dy="11.5">XIAO power: USB-C only · no fan-battery feed to XIAO 3V3/5V · original charger, protection and motor driver unchanged</tspan></text><text x="374.976" y="10.9272" dominant-baseline="central" fill="#516a77" font-size="10.5" font-family="sans" text-anchor="middle"><tspan x="374.976" dy="10.5">Documented prototype only — re-measure button-pad voltage, common ground and divider values on every fan revision</tspan></text><circle cx="232.12800000000001" cy="-368.28000000000003" r="3.348" style="stroke:#b76600;fill:#b76600;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="232.12800000000001" cy="-265.608" r="3.348" style="stroke:#b76600;fill:#b76600;stroke-width:2.0;stroke-dasharray:-;" /></svg>